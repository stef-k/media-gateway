# Reference nginx origin/vhost for Media Gateway.
#
# This file is intentionally explicit because nginx is part of the public security
# boundary. It must expose only the gateway's public media route. Immich, provider
# metadata, search/control endpoints and NAS paths must never be routed through this
# hostname.
#
# This example listens on loopback so a local tunnel/edge (for example Cloudflare
# Tunnel) can target nginx. Installations that terminate public TLS directly in nginx
# may replace the listen/TLS directives while preserving the route restrictions.

server {
    # Local origin socket used by the external tunnel/edge. Choose a deployment-
    # specific free port; do not make the Go gateway itself the public listener.
    listen 127.0.0.1:8089;

    # Replace with the deployment's media hostname, for example media.stefk.me.
    server_name media.example.com;

    # Keep this vhost's public HTTP access/proxy errors separate from unrelated sites.
    # The standard `combined` format is adequate for V0 because V0 uses no secret
    # query parameters. If signed/tokenized query parameters are ever introduced,
    # define/use a safe log format that omits query strings before enabling them.
    # Never add Authorization/provider-secret headers to a log format.
    access_log /var/log/nginx/media-gateway.access.log combined;
    error_log /var/log/nginx/media-gateway.error.log warn;

    # Public delivery is GET/HEAD only and should not accept meaningful request
    # bodies. A tiny limit reduces accidental/hostile body buffering before routing.
    client_max_body_size 1k;

    # This is the ONLY intended public application prefix.
    location /media/ {
        # Reject every HTTP method except safe read methods at nginx before the
        # request reaches the gateway. The Go service must enforce methods too.
        limit_except GET HEAD {
            deny all;
        }

        # Forward only to the loopback-bound Media Gateway process. Never point this
        # upstream at Immich or a NAS/static-file location.
        proxy_pass http://127.0.0.1:2290;

        # Use HTTP/1.1 to the local upstream. No WebSocket exposure is required for
        # the public media surface.
        proxy_http_version 1.1;

        # Stream provider-backed media rather than forcing nginx to buffer entire
        # responses before forwarding them. Revisit only with measured cache needs.
        proxy_buffering off;

        # Keep upstream failures bounded. Application/provider timeouts must also be
        # bounded so a stalled private provider cannot hold public requests forever.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Preserve ordinary reverse-proxy request context for logging and absolute-
        # URL behavior. None of these headers grants publication permission.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fail closed for everything else. In particular do not publish health details,
    # internal search, provider metadata, configuration, diagnostics, control APIs or
    # the Immich UI/API through this hostname.
    location / {
        return 404;
    }
}
