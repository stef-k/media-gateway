# Reference origin vhost for Media Gateway.
#
# This example listens on loopback so a local tunnel/edge can target it. Deployments
# that terminate public TLS in nginx should replace the listen directive while
# preserving the route boundary below.

server {
    listen 127.0.0.1:8089;
    server_name media.example.com;

    client_max_body_size 1k;

    location /media/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:2290;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Do not publish health, search, metadata, configuration, or internal/control
    # routes through this hostname.
    location / {
        return 404;
    }
}
