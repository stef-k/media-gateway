# Include once inside nginx's http {} context, on a dedicated free origin port.
# Adapt the hostname, both listen directives and log paths to the installation.
# A local tunnel/edge must target nginx with Host: media.example.com, never the
# gateway or Immich. Direct TLS installations must preserve both server boundaries.

# Aggregate per-vhost admission, independent of client IP or tunnel topology.
# Lax reference defaults: tune against measured gateway/provider capacity.
limit_req_zone $server_name zone=media_gateway_rate:1m rate=20r/s;
limit_conn_zone $server_name zone=media_gateway_conn:1m;

# Query/header-free access facts. Route is classified rather than logging arbitrary
# caller paths. Future signed URLs still require an error-log/edge privacy review:
# nginx error messages can include the original request line, including its query.
map $request_uri $media_gateway_route {
    default denied;
    "~^/catalog/(?:collections|assets)(?:\?.*)?$" catalog;
    "~^/catalog/assets/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" catalog;
    "~^/media/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/preview(?:\?.*)?$" preview;
    "~^/media/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/original(?:\?.*)?$" original;
}
# Range is the only caller media header; preview receives no Range. The gateway
# validates syntax after current authorization and ignores Range for images.
map $media_gateway_route $media_gateway_range {
    default "";
    original $http_range;
}
log_format media_gateway '$remote_addr $request_method route=$media_gateway_route '
                         'status=$status bytes=$body_bytes_sent time=$request_time '
                         'upstream_status=$upstream_status upstream_time=$upstream_response_time '
                         'request_limit=$limit_req_status connection_limit=$limit_conn_status';

server {
    # Explicit default: unknown/missing Host must never fall into the media server.
    listen 127.0.0.1:8089 default_server;
    server_name "";
    access_log /var/log/nginx/media-gateway.access.log media_gateway;
    error_log /var/log/nginx/media-gateway.error.log warn;
    return 404;
}

server {
    # Numeric loopback origin for a same-host edge; no public application listener.
    listen 127.0.0.1:8089;
    server_name media.example.com;
    access_log /var/log/nginx/media-gateway.access.log media_gateway;
    error_log /var/log/nginx/media-gateway.error.log warn;
    server_tokens off;

    # Bound client header/body inactivity and idle connections. Bodies are unused.
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 65s;

    # Override nginx's implicit slash-appending redirect for proxied prefixes.
    location = /media { return 404; }

    # Media proxy location. ^~ prevents regex locations from overriding this prefix.
    location ^~ /media/ {
        # nginx matches normalized URIs. Check the ORIGINAL target as well, so
        # escapes, dot/repeated separators and extra segments cannot be laundered
        # into a route. A return-only if does not rewrite or change locations.
        if ($media_gateway_route = denied) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }

        # Rewrite-phase returns above reject noise before limit admission.
        # These protect availability, not publication authorization.
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=media_gateway_rate burst=40 nodelay;
        limit_conn media_gateway_conn 32;
        # Access logs retain 429 outcomes; routine shedding stays below warn.
        limit_req_log_level notice;
        limit_conn_log_level notice;

        # Fixed authority, no URI replacement, variables, provider or storage path.
        proxy_pass http://127.0.0.1:2290;
        proxy_http_version 1.1;

        # Allowlist transport context only: no caller credentials, cookies,
        # forwarded identity chains, Upgrade or conditional headers.
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1:2290;
        proxy_set_header Connection close;
        proxy_set_header Range $media_gateway_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Stream authorized media without temporary response files or cache hits.
        # Preserve the application's Cache-Control: no-store unchanged.
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_redirect off;

        # Read is an inactivity timeout, not a total deadline. 70s accommodates
        # the application's 60s original read/write inactivity bounds. Local connect
        # and bodyless request sends need only 5s/10s. No retry/fallback extends work.
        proxy_connect_timeout 5s;
        proxy_read_timeout 70s;
        proxy_send_timeout 10s;
    }

    location = /catalog {
        add_header Access-Control-Allow-Origin "*" always;
        return 404;
    }

    # Public catalog uses the same aggregate admission envelope as media.
    location ^~ /catalog/ {
        # Include edge denials/admission failures in the credential-free contract.
        # Replace the application grant to avoid duplicate CORS headers.
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        # nginx matches normalized URIs. Check the ORIGINAL target as well, so
        # escapes, dot/repeated separators and extra segments cannot be laundered
        # into a route. A return-only if does not rewrite or change locations.
        if ($media_gateway_route != catalog) { return 404; }
        if ($request_method !~ ^GET$) { return 404; }

        # Rewrite-phase returns above reject noise before limit admission.
        # These protect availability, not publication authorization.
        limit_req_status 429;
        limit_conn_status 429;
        limit_req zone=media_gateway_rate burst=40 nodelay;
        limit_conn media_gateway_conn 32;
        # Access logs retain 429 outcomes; routine shedding stays below warn.
        limit_req_log_level notice;
        limit_conn_log_level notice;

        # Fixed authority, no URI replacement, variables, provider or storage path.
        proxy_pass http://127.0.0.1:2290;
        proxy_http_version 1.1;

        # Allowlist transport context only: no caller credentials, cookies,
        # forwarded identity chains, Upgrade or conditional headers.
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1:2290;
        proxy_set_header Connection close;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Return bounded catalog JSON without temporary response files or cache hits.
        # Preserve the application's Cache-Control: no-store unchanged.
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_redirect off;

        # Accommodate the 30s catalog deadline with finite transport bounds.
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
    }

    # No internal, API, search, config, control, diagnostic or static-file surface.
    # Never add alias/root/try_files, error-page storage fallback or other proxies.
    location / { return 404; }
}
