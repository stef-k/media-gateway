# Include once inside nginx's http {} context, on a dedicated free origin port.
# Adapt the hostname, both listen directives and log paths to the installation.
# A local tunnel/edge must target nginx with Host: media.example.com, never the
# gateway or Immich. Direct TLS installations must preserve both server boundaries.

# Query/header-free access facts. Route is classified rather than logging arbitrary
# caller paths. Future signed URLs still require an error-log/edge privacy review:
# nginx error messages can include the original request line, including its query.
map $request_uri $media_gateway_route {
    default denied;
    "~^/media/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/preview(?:\?.*)?$" preview;
    "~^/media/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/original(?:\?.*)?$" original;
}
log_format media_gateway '$remote_addr $request_method route=$media_gateway_route '
                         'status=$status bytes=$body_bytes_sent time=$request_time '
                         'upstream_status=$upstream_status upstream_time=$upstream_response_time';

server {
    # Explicit default: unknown/missing Host must never fall into the media server.
    listen 127.0.0.1:8089 default_server;
    server_name "";
    access_log /var/log/nginx/media-gateway.access.log media_gateway;
    error_log /var/log/nginx/media-gateway.error.log warn;
    return 404;
}

server {
    # Numeric loopback origin for a same-host edge; no public application listener.
    listen 127.0.0.1:8089;
    server_name media.example.com;
    access_log /var/log/nginx/media-gateway.access.log media_gateway;
    error_log /var/log/nginx/media-gateway.error.log warn;
    server_tokens off;

    # Bound client header/body inactivity and idle connections. Bodies are unused.
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 65s;

    # Override nginx's implicit slash-appending redirect for proxied prefixes.
    location = /media { return 404; }

    # Sole proxy location. ^~ prevents regex locations from overriding this prefix.
    location ^~ /media/ {
        # nginx matches normalized URIs. Check the ORIGINAL target as well, so
        # escapes, dot/repeated separators and extra segments cannot be laundered
        # into a route. A return-only if does not rewrite or change locations.
        if ($media_gateway_route = denied) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }

        # Fixed authority, no URI replacement, variables, provider or storage path.
        proxy_pass http://127.0.0.1:2290;
        proxy_http_version 1.1;

        # Allowlist transport context only: no caller credentials, cookies,
        # forwarded identity chains, Upgrade, range or conditional headers.
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1:2290;
        proxy_set_header Connection close;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Stream bounded images without temporary response files or cache hits.
        # Preserve the application's Cache-Control: no-store unchanged.
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_redirect off;

        # Read is an inactivity timeout, not a total deadline. 70s accommodates
        # the application's 60s work context and 65s write deadline. Local connect
        # and bodyless request sends need only 5s/10s. No retry/fallback extends work.
        proxy_connect_timeout 5s;
        proxy_read_timeout 70s;
        proxy_send_timeout 10s;
    }

    # No internal, API, search, config, control, diagnostic or static-file surface.
    # Never add alias/root/try_files, error-page storage fallback or other proxies.
    location / { return 404; }
}
