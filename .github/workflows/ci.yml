# One Linux job checks the reviewed toolchain; release packaging is separate work.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read # Checkout needs read access; validation needs no write token.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Bound a stalled build or test run.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1' # Deliberate reviewed patch, not a floating family.
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/media-gateway
      - name: Check portable smoke tooling
        # Standard-library CLI regressions only; installed-host qualification is separate.
        run: |
          python3 scripts/test_smoke.py
          bash -n scripts/build-bundle.sh
      - name: Verify Linux bundle
        # Reuse this checkout/toolchain; no release publishing or additional job.
        run: |
          bundle_dir=$(mktemp -d)
          scripts/build-bundle.sh "$bundle_dir"
          mkdir "$bundle_dir/extracted"
          tar -xzf "$bundle_dir/media-gateway-linux-amd64-$(git rev-parse HEAD).tar.gz" -C "$bundle_dir/extracted"
          (cd "$bundle_dir/extracted" && sha256sum --check --strict SHA256SUMS)
          "$bundle_dir/extracted/media-gateway" -version | tee "$bundle_dir/version"
          grep -F "revision=$(git rev-parse HEAD) modified=false go=go1.27.1" "$bundle_dir/version"
          for template in config.toml.example media-gateway.service nginx.conf; do
            cmp "deploy/$template" "$bundle_dir/extracted/$template"
          done
